<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ModShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: single centered column of three numbered steps (add → choose → result); results as dense scan rows. Copper + oxidized-copper palette. */
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --surface2:#F4F5F3; --line:#D3D8D4;
  --fg:#1B201E; --muted:#5D6762;
  --accent:#B05E2B; --accent-fg:#FFFFFF; --accent-soft:#F3E3D7;
  --ok:#2C8569; --ok-soft:#DDEFE8; --warn:#9A7200; --warn-soft:#F5ECCF;
  --bad:#B33A3A; --bad-soft:#F6DEDE; --info:#2F67AE; --info-soft:#DCE7F5;
  --f-display:"Pixelify Sans", ui-monospace, monospace;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131615; --surface:#1B1F1E; --surface2:#222725; --line:#323a37;
  --fg:#E5E9E6; --muted:#98A39D;
  --accent:#E0894D; --accent-fg:#1A0F08; --accent-soft:#3A2618;
  --ok:#4FBF9C; --ok-soft:#173129; --warn:#E3B93C; --warn-soft:#352C12;
  --bad:#E86F6F; --bad-soft:#3A1C1C; --info:#73A3E6; --info-soft:#1A2A40;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1B1F1E; --surface2:#222725; --line:#323a37;
  --fg:#E5E9E6; --muted:#98A39D;
  --accent:#E0894D; --accent-fg:#1A0F08; --accent-soft:#3A2618;
  --ok:#4FBF9C; --ok-soft:#173129; --warn:#E3B93C; --warn-soft:#352C12;
  --bad:#E86F6F; --bad-soft:#3A1C1C; --info:#73A3E6; --info-soft:#1A2A40;
  color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:700 2rem/1 var(--f-display);margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.tag{color:var(--muted);margin:6px 0 0;max-width:60ch}
h2{font:500 1.15rem/1.2 var(--f-display);margin:0;display:flex;align-items:center;gap:10px}
h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--accent);color:var(--accent-fg);font-size:.95rem}
section.step{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
button,.btn{font:600 .95rem var(--f-body);border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:9px 14px;cursor:pointer;border-radius:2px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
button.primary:active{box-shadow:inset 0 2px 0 rgba(0,0,0,.22)}
button:disabled{opacity:.5;cursor:not-allowed}
.drop{border:2px dashed var(--line);background:var(--surface2);padding:28px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0;color:var(--muted)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.files{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600}
.files .list{font:400 .8rem var(--f-mono);color:var(--muted);max-height:96px;overflow:auto;width:100%;word-break:break-all}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{position:relative;border:1px solid var(--line);background:var(--surface2);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode b{font-weight:700}
.mode small{color:var(--muted);font-size:.85rem;line-height:1.4}
.mode:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mode:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;min-width:0}
label.f small{font-weight:400;color:var(--muted);line-height:1.4}
select,input[type=text],input[type=password],input[type=url]{font:400 .95rem var(--f-body);padding:9px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:2px;width:100%;min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;font-size:.9rem;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.info{font-size:.88rem;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.prog{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.msg{padding:10px 12px;font-size:.9rem;border-left:3px solid var(--info);background:var(--info-soft)}
.msg.bad{border-color:var(--bad);background:var(--bad-soft)}
.msg.warn{border-color:var(--warn);background:var(--warn-soft)}
.msg.ok{border-color:var(--ok);background:var(--ok-soft)}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 .75rem var(--f-body);padding:3px 8px;border-radius:2px;white-space:nowrap;letter-spacing:.02em}
.p-update{background:var(--accent-soft);color:var(--accent)}
.p-dep{background:var(--info-soft);color:var(--info)}
.p-keep,.p-current{background:var(--ok-soft);color:var(--ok)}
.p-manual{background:var(--warn-soft);color:var(--warn)}
.p-missing{background:var(--bad-soft);color:var(--bad)}
.p-unknown,.p-dup{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.list-mods{display:flex;flex-direction:column;border:1px solid var(--line)}
.mod{display:grid;grid-template-columns:auto 36px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.mod:last-child{border-bottom:0}
.mod.off{opacity:.55}
.mod .ic{width:36px;height:36px;background:var(--surface2);border:1px solid var(--line);object-fit:cover;image-rendering:pixelated;display:block}
.mod .nm{font-weight:600;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;min-width:0;word-break:break-word}
.mod .src{font:600 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mod .vr{font:400 .8rem var(--f-mono);color:var(--muted);word-break:break-all}
.mod .vr b{color:var(--fg);font-weight:600}
.mod .nt{font-size:.82rem;color:var(--muted)}
.mod a.go{color:var(--muted);text-decoration:none;font-size:1.1rem;padding:4px}
.mod a.go:hover{color:var(--accent)}
@media (max-width:560px){.mod{grid-template-columns:auto 36px minmax(0,1fr)}.mod .pill{grid-column:3;justify-self:start}.mod a.go{display:none}}
.out{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0;width:min(640px, calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg-h{display:flex;justify-content:space-between;align-items:center}
details summary{cursor:pointer;font-weight:600;font-size:.9rem}
pre.code{font:400 .75rem/1.5 var(--f-mono);background:var(--surface2);border:1px solid var(--line);padding:12px;overflow-x:auto;margin:8px 0 0;white-space:pre}
footer{color:var(--muted);font-size:.82rem;text-align:center}
.cmp{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);padding:12px;background:var(--surface2)}
.cmp h3{font:500 1rem var(--f-display);margin:0 0 8px}
.cmp details{border-bottom:1px solid var(--line)}
.cmp details:last-child{border-bottom:0}
.cmp summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:76px minmax(0,1fr) 64px auto;gap:10px;align-items:center;padding:6px 0}
.cmp summary::-webkit-details-marker{display:none}
.cmp .v{font:600 .85rem var(--f-mono)}
.cmp .c{font:400 .8rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.cmp .b{height:10px;background:var(--surface);border:1px solid var(--line)}
.cmp .b i{display:block;height:100%}
.b .full{background:var(--ok)}.b .most{background:var(--accent)}.b .few{background:var(--bad)}
.cmp .miss{font-size:.82rem;color:var(--muted);padding:0 0 8px 86px}
@media (max-width:560px){.cmp summary{grid-template-columns:60px minmax(0,1fr) 52px}.cmp summary button{grid-column:1/-1;justify-self:start}.cmp .miss{padding-left:0}}
button.sm{padding:4px 10px;font-size:.8rem}
button.lnk{background:none;border:0;padding:0;color:var(--accent);font-size:.82rem;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.mod .cf{color:var(--bad);font-size:.82rem;font-weight:600}
.cl{display:flex;flex-direction:column;gap:4px;font-size:.9rem;overflow-wrap:anywhere}
.cl h4{font:500 1rem var(--f-display);margin:14px 0 2px;color:var(--accent)}
.cl h4:first-child{margin-top:0}
.cl h5{font-size:.9rem;margin:8px 0 0}
.cl code{font:.82em var(--f-mono);background:var(--surface2);padding:1px 4px}
.cl a{color:var(--accent)}
.srch{display:flex;gap:8px;flex-wrap:wrap}
.srch input{flex:1 1 220px;width:auto}
.sres{display:flex;flex-direction:column;border:1px solid var(--line)}
.sres .it{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sres .it:last-child{border-bottom:0}
.sres img,.sres .ph{width:32px;height:32px;object-fit:cover;background:var(--surface2);border:1px solid var(--line);image-rendering:pixelated;display:block}
.sres .d{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.added{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:600;padding:3px 2px 3px 8px;background:var(--ok-soft);color:var(--ok)}
.chip button{border:0;background:none;padding:0 6px;color:inherit;font-size:1rem;line-height:1}
.fbar{display:flex;gap:8px;flex-wrap:wrap}
.fbar input{flex:1 1 auto}
.sum button.pill{border:1px solid transparent;cursor:pointer}
.sum button.pill[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 -2px 0 currentColor}
.p-add{background:var(--ok-soft);color:var(--ok)}
.p-orphan{background:var(--warn-soft);color:var(--warn)}
.badge{font:600 .68rem var(--f-body);padding:1px 6px;border-radius:2px;background:var(--warn-soft);color:var(--warn);letter-spacing:.03em}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem}
.facts span{white-space:nowrap}
.facts b{font-variant-numeric:tabular-nums}
.recs{display:flex;flex-direction:column;gap:8px}
.recs h3{font:500 1rem var(--f-display);margin:0}
.recs .info{margin:4px 0 0}
.recs-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sres .it3{grid-template-columns:32px minmax(0,1fr) auto auto}
.sres a{color:var(--fg);text-decoration:none}.sres a:hover b{color:var(--accent)}
button.x{border:0;background:none;padding:2px 6px;color:var(--muted);font-size:1.1rem;line-height:1}
button.x:hover{color:var(--bad)}
.p-jarok{background:var(--ok-soft);color:var(--ok)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mod<span>Shift</span></h1>
      <p class="tag" data-t="tagline"></p>
    </div>
    <button id="btnSettings" type="button"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M7 0h2v2.1a6 6 0 0 1 1.9.8l1.5-1.5 1.4 1.4-1.5 1.5c.4.6.6 1.2.8 1.9H16v2h-2.1a6 6 0 0 1-.8 1.9l1.5 1.5-1.4 1.4-1.5-1.5a6 6 0 0 1-1.9.8V16H7v-2.1a6 6 0 0 1-1.9-.8l-1.5 1.5-1.4-1.4 1.5-1.5A6 6 0 0 1 2.1 9H0V7h2.1c.2-.7.4-1.3.8-1.9L1.4 3.6l1.4-1.4 1.5 1.5c.6-.4 1.2-.6 1.9-.8V0Zm1 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg><span data-t="settings"></span></button>
  </header>

  <section class="step" id="s1">
    <h2><span class="n">1</span><span data-t="s1"></span></h2>
    <div class="drop" id="drop" tabindex="0">
      <p data-t="drop"></p>
      <div class="row-btns">
        <button type="button" id="btnFiles" data-t="pickFiles"></button>
        <button type="button" id="btnDir" data-t="pickDir"></button>
      </div>
      <input type="file" id="inFiles" accept=".jar" multiple hidden>
      <input type="file" id="inDir" webkitdirectory multiple hidden>
    </div>
    <div class="files" id="filesBox" hidden>
      <span id="filesCount"></span>
      <button type="button" id="btnClear" data-t="clear"></button>
      <div class="list" id="filesList"></div>
    </div>
    <div class="srch"><input type="text" id="addQ" data-tp="addPh" autocomplete="off"><button type="button" id="btnAddQ" data-t="search"></button></div>
    <div class="sres" id="sres" hidden></div>
    <div class="added" id="addedBox" hidden></div>
  </section>

  <section class="step" id="s2">
    <h2><span class="n">2</span><span data-t="s2"></span></h2>
    <div class="modes" role="radiogroup">
      <label class="mode"><input type="radio" name="mode" id="m-update" value="update" checked><b data-t="m_update"></b><small data-t="m_update_d"></small></label>
      <label class="mode"><input type="radio" name="mode" id="m-setver" value="setver"><b data-t="m_setver"></b><small data-t="m_setver_d"></small></label>
      <label class="mode"><input type="radio" name="mode" id="m-both" value="both"><b data-t="m_both"></b><small data-t="m_both_d"></small></label>
    </div>
    <div class="grid2">
      <label class="f" id="verWrap"><span data-t="targetVer"></span>
        <select id="selVer"></select>
        <input type="text" id="txtVer" placeholder="1.21.1" hidden>
        <span class="chk"><input type="checkbox" id="chkSnap"><span data-t="snapshots"></span></span>
      </label>
      <label class="f"><span data-t="loader"></span>
        <select id="selLoader">
          <option value="auto" data-t="auto"></option>
          <option value="fabric">Fabric</option>
          <option value="neoforge">NeoForge</option>
          <option value="forge">Forge</option>
          <option value="quilt">Quilt</option>
        </select>
        <small data-t="loader_h"></small>
      </label>
    </div>
    <p class="info" id="updInfo" data-t="target_info_update"></p>
    <div class="row-btns"><button type="button" class="primary" id="btnAnalyze" data-t="analyze"></button><button type="button" id="btnCompat" data-t="compatBtn"></button><span class="info" id="cfState"></span></div>
    <div class="prog" id="prog" hidden><span class="info" id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
    <div id="msgs" class="prog"></div>
    <div id="compat" class="cmp" hidden></div>
  </section>

  <section class="step" id="s3" hidden>
    <h2><span class="n">3</span><span data-t="s3"></span></h2>
    <p class="info mono" id="detected"></p>
    <div class="facts" id="facts"></div>
    <div class="sum" id="sum"></div>
    <div class="msg warn" id="stale" hidden data-t="needsAnalyze"></div>
    <div id="conf" class="msg bad" hidden></div>
    <div class="fbar"><input type="text" id="fq" data-tp="filterPh" autocomplete="off"><button type="button" class="sm" id="btnSelAll" data-t="selAll"></button><button type="button" class="sm" id="btnSelNone" data-t="selNone"></button></div>
    <div class="list-mods" id="mods"></div>
    <div class="recs" id="recs" hidden></div>
    <div class="out">
      <button type="button" class="primary" id="btnZip" data-t="zip"></button>
      <button type="button" id="btnFolder" data-t="folder"></button>
    </div>
    <div id="outMsgs" class="prog"></div>
  </section>

  <footer data-t="privacy"></footer>
</div>

<dialog id="dlg">
  <div class="dlg">
    <div class="dlg-h"><h2 data-t="settings"></h2><button type="button" id="btnClose" data-t="close"></button></div>
    <label class="f"><span data-t="cfKey"></span><input type="password" id="setKey" autocomplete="off" spellcheck="false"><small data-t="cfKey_h"></small></label>
    <label class="f"><span data-t="cfProxy"></span><input type="url" id="setProxy" placeholder="https://mod-proxy.adin.workers.dev" spellcheck="false"><small data-t="cfProxy_h"></small></label>
    <div class="grid2">
      <label class="f"><span data-t="priority"></span><select id="setPrio"><option value="mr" data-t="pr_mr"></option><option value="cf" data-t="pr_cf"></option></select></label>
      <label class="f"><span data-t="channel"></span><select id="setChan"><option value="release" data-t="ch_release"></option><option value="beta" data-t="ch_beta"></option><option value="alpha" data-t="ch_alpha"></option></select></label>
      <label class="f"><span data-t="lang"></span><select id="setLang"><option value="tr">Türkçe</option><option value="en">English</option></select></label>
    </div>
    <span class="chk"><input type="checkbox" id="setDeps"><span data-t="autoDeps"></span></span>
    <details>
      <summary data-t="worker"></summary>
      <p class="info" data-t="worker_h"></p>
      <button type="button" id="btnCopy" data-t="copy"></button>
      <pre class="code" id="workerCode"></pre>
    </details>
  </div>
</dialog>

<dialog id="clDlg">
  <div class="dlg">
    <div class="dlg-h"><h2 id="clTitle"></h2><button type="button" id="clClose" data-t="close"></button></div>
    <div class="row-btns"><button type="button" class="sm" id="clTr" data-t="translate"></button><span class="info" id="clInfo"></span></div>
    <div class="cl" id="clBody"></div>
  </div>
</dialog>

<script>
"use strict";
/* ---------- i18n ---------- */
const I18N={
tr:{tagline:"Mod .jar dosyalarını bırak. En güncel ya da seçtiğin Minecraft sürümüne uygun versiyonları Modrinth ve CurseForge'dan toplanıp sana klasör olarak verilir.",
settings:"Ayarlar",s1:"Modları ekle",drop:".jar dosyalarını veya mods klasörünü buraya sürükle",pickFiles:"Dosya seç",pickDir:"Klasör seç",clear:"Temizle",nFiles:"{n} mod dosyası",
s2:"Ne yapılsın?",m_update:"Güncelle",m_update_d:"Mevcut Minecraft sürümünde kal, her modun en yeni versiyonunu al.",m_setver:"Sürüm ayarla",m_setver_d:"Seçilen sürüme taşı. Zaten uyumlu olan modlara dokunma.",m_both:"Sürüm ayarla + güncelle",m_both_d:"Seçilen sürüme taşı ve her modun o sürümdeki en yeni versiyonunu al.",
targetVer:"Hedef Minecraft sürümü",snapshots:"Snapshot'ları göster",loader:"Loader",auto:"Otomatik (tespit edilen)",loader_h:"Farklı bir loader seçersen modların o loader versiyonları aranır.",
target_info_update:"Hedef sürüm, modlarından otomatik tespit edilir.",analyze:"Analiz et",s3:"Sonuç",detected:"Mevcut paket: {v} · {l}  →  Hedef: {tv} · {tl}",

function t(k,v){let s=(I18N[SET.lang]||I18N.tr)[k]??I18N.tr[k]??k;if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s}

/* ---------- helpers ---------- */
async function pool(items,n,fn){let i=0;const run=async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}};await Promise.all(Array.from({length:Math.min(n,items.length)},run))}
async function sha1hex(buf){const h=await crypto.subtle.digest("SHA-1",buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function cfFingerprint(bytes){
  const buf=new Uint8Array(bytes.length);let n=0;
  for(let i=0;i<bytes.length;i++){const b=bytes[i];if(b!==9&&b!==10&&b!==13&&b!==32)buf[n++]=b}
  const m=0x5bd1e995;let h=(1^n)>>>0,i=0;
  while(n-i>=4){let k=buf[i]|(buf[i+1]<<8)|(buf[i+2]<<16)|(buf[i+3]<<24);k=Math.imul(k,m);k^=k>>>24;k=Math.imul(k,m);h=Math.imul(h,m)^k;i+=4}
  switch(n-i){case 3:h^=buf[i+2]<<16;case 2:h^=buf[i+1]<<8;case 1:h^=buf[i];h=Math.imul(h,m)}
  h^=h>>>13;h=Math.imul(h,m);h^=h>>>15;return h>>>0;
}
function vIdx(v){return v in S.tagIdx?S.tagIdx[v]:1e6}
function newest(list){return [...(list||[])].sort((a,b)=>vIdx(a)-vIdx(b))[0]}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function mr(path,opt={}){
  for(let a=0;a<3;a++){
    const r=await fetch("https://api.modrinth.com/v2"+path,{method:opt.method||"GET",headers:opt.body?{"Content-Type":"application/json"}:{},body:opt.body?JSON.stringify(opt.body):undefined});
    if(r.status===429){await sleep((+(r.headers.get("X-Ratelimit-Reset"))||5)*1000);continue}
    if(r.status===404)return null;
    if(r.status===410)throw new Error(t("e_v2"));
    if(!r.ok)throw new Error("Modrinth "+r.status);
    return r.json();
  }
  throw new Error("Modrinth 429");
}
async function cf(path,opt={}){
  const proxy=SET.cfProxy.trim().replace(/\/+$/,"");
  const base=proxy?proxy+"/v1":"https://api.curseforge.com/v1";
  const h={"Accept":"application/json"};if(opt.body)h["Content-Type"]="application/json";if(!proxy)h["x-api-key"]=SET.cfKey.trim();
  let r;
  try{r=await fetch(base+path,{method:opt.method||"GET",headers:h,body:opt.body?JSON.stringify(opt.body):undefined})}
  catch(_){S.cfBroken=true;throw new Error("cors")}
  if(r.status===404)return null;
  if(r.status===401||r.status===403){S.cfBroken=true;throw new Error("cfkey")}
  if(!r.ok)throw new Error("CurseForge "+r.status);
  return r.json();
}
function cfErr(e){if(e.message==="cors")addMsg(t("e_cors"),"warn");else if(e.message==="cfkey")addMsg(t("e_cfkey"),"warn");else addMsg(t("e_net",{m:e.message}),"warn")}

function mrVer(v){const f=v.files.find(x=>x.primary)||v.files[0];return{id:v.id,number:v.version_number,gv:v.game_versions||[],loaders:v.loaders||[],type:v.version_type,date:v.date_published,deps:(v.dependencies||[]).filter(d=>d.dependency_type==="required"),inc:(v.dependencies||[]).filter(d=>d.dependency_type==="incompatible"&&d.project_id).map(d=>d.project_id),opt:(v.dependencies||[]).filter(d=>d.dependency_type==="optional"&&d.project_id).map(d=>d.project_id),file:f&&{url:f.url,name:f.filename,sha1:f.hashes&&f.hashes.sha1,size:f.size}}}
function mrProjN(p){return{id:p.id||p.project_id,slug:p.slug,title:p.title,icon:p.icon_url,url:"https://modrinth.com/mod/"+p.slug,lib:(p.categories||[]).concat(p.display_categories||[],p.additional_categories||[]).includes("library"),gv:p.game_versions||p.versions||[],loaders:p.loaders||(p.categories||[]).filter(c=>LOADERS.includes(c)),cats:[...new Set((p.categories||[]).concat(p.display_categories||[]))].filter(c=>!LOADERS.includes(c)&&!["library","minecraft"].includes(c)),downloads:p.downloads||0,desc:p.description||"",src:"mr"}}

function cfFile(f){const gv=(f.gameVersions||[]);const sha=(f.hashes||[]).find(h=>h.algo===1);return{id:f.id,number:f.displayName||f.fileName,gv:gv.filter(isMc),loaders:gv.map(x=>x.toLowerCase()).filter(x=>LOADERS.includes(x)),type:["","release","beta","alpha"][f.releaseType]||"release",date:f.fileDate,deps:(f.dependencies||[]).filter(d=>d.relationType===3).map(d=>({cfModId:d.modId})),inc:(f.dependencies||[]).filter(d=>d.relationType===5).map(d=>d.modId),opt:[],file:{url:f.downloadUrl,name:f.fileName,sha1:sha&&sha.value,size:f.fileLength}}}
function cfProjN(m){return{id:m.id,slug:m.slug,title:m.name,lib:(m.categories||[]).some(c=>/librar/i.test(c.name||"")),icon:m.logo&&m.logo.thumbnailUrl,url:(m.links&&m.links.websiteUrl)||("https://www.curseforge.com/minecraft/mc-mods/"+m.slug),allowDist:m.allowModDistribution!==false,latest:m.latestFilesIndexes||[],src:"cf"}}
async function mrLoadProjects(ids){ids=ids.filter(id=>id&&!S.mrProj[id]);for(let i=0;i<ids.length;i+=100){const r=await mr("/projects?ids="+enc(JSON.stringify(ids.slice(i,i+100))))||[];for(const p of r)S.mrProj[p.id]=mrProjN(p)}}

/* ---------- jar metadata ---------- */
async function readMeta(buf){
  const m={deps:[]};let zip;try{zip=await JSZip.loadAsync(buf)}catch(_){m.bad=true;return m}
  const tomlDeps=s=>{const i=s.indexOf("[[dependencies");if(i<0)return[];const out=[],re=/modId\s*=\s*["']([^"']+)["']/g,d=s.slice(i);let r;while((r=re.exec(d)))out.push(r[1]);return out};
  const tomlReq=(s,id)=>{const r=new RegExp("modId\\s*=\\s*[\"']"+id+"[\"'][\\s\\S]*?versionRange\\s*=\\s*[\"']([^\"']+)[\"']").exec(s);return r?r[1]:undefined};
  const joinV=v=>Array.isArray(v)?v.join(" "):v;
  const pick=(s,k)=>{const r=new RegExp('"'+k+'"\\s*:\\s*"([^"]*)"').exec(s);return r?r[1]:undefined};
  const toml=(s,k)=>{const r=new RegExp("^\\s*"+k+"\\s*=\\s*[\"']([^\"']+)[\"']","m").exec(s);return r?r[1]:undefined};
  let f;
  if((f=zip.file("fabric.mod.json"))){const s=await f.async("string");m.loader="fabric";try{const j=JSON.parse(s);m.modId=j.id;m.name=j.name||j.id;m.version=j.version;m.deps=Object.keys(j.depends||{}).concat(Object.keys(j.recommends||{}),Object.keys(j.suggests||{}));m.provides=(j.provides||[]).filter(x=>typeof x==="string");m.loaderReq=joinV((j.depends||{}).fabricloader);m.mcReq=(j.depends||{}).minecraft}catch(_){m.modId=pick(s,"id");m.name=pick(s,"name")||m.modId;m.version=pick(s,"version");m.loaderReq=pick(s,"fabricloader")}}
  else if((f=zip.file("quilt.mod.json"))){const s=await f.async("string");m.loader="quilt";try{const q=JSON.parse(s).quilt_loader||{};m.modId=q.id;m.name=(q.metadata&&q.metadata.name)||q.id;m.version=q.version;const ds=(q.depends||[]).map(d=>typeof d==="string"?{id:d}:d);m.deps=ds.map(d=>d.id).filter(Boolean);const ql=ds.find(d=>d.id==="quilt_loader");m.loaderReq=ql&&joinV(ql.versions);const mc=ds.find(d=>d.id==="minecraft");m.mcReq=mc&&mc.versions}catch(_){m.modId=pick(s,"id")}}
  else if((f=zip.file("META-INF/neoforge.mods.toml"))){const s=await f.async("string");m.loader="neoforge";m.modId=toml(s,"modId");m.name=toml(s,"displayName")||m.modId;m.version=toml(s,"version");m.deps=tomlDeps(s);m.loaderReq=tomlReq(s,"neoforge");m.mcReq=tomlReq(s,"minecraft");m.mcMaven=true}
  else if((f=zip.file("META-INF/mods.toml"))){const s=await f.async("string");m.loader="forge";m.modId=toml(s,"modId");m.name=toml(s,"displayName")||m.modId;m.version=toml(s,"version");m.deps=tomlDeps(s);m.loaderReq=tomlReq(s,"forge");m.mcReq=tomlReq(s,"minecraft");m.mcMaven=true}
  else m.none=true;
  if(m.version&&m.version.includes("${"))m.version=undefined;
  m.deps=(m.deps||[]).filter(d=>d&&d!==m.modId);
  return m;
}

/* ---------- identify ---------- */
async function identify(){
  const ents=S.files.map((f,i)=>({uid:"f"+i,file:f,fileName:f.name,meta:{}}));
  let done=0;setProg(t("p_read"),0);
  const wantFp=!!(SET.cfKey||SET.cfProxy);
  await pool(ents,4,async e=>{const buf=await e.file.arrayBuffer();e.sha1=await sha1hex(buf);e.meta=await readMeta(buf);if(wantFp)e.fp=cfFingerprint(new Uint8Array(buf));setProg(t("p_read"),++done/ents.length*30)});
  const order=SET.priority==="cf"?["cf","mr"]:["mr","cf"];
  for(const src of order){
    const left=ents.filter(e=>!e.src);if(!left.length)break;
    if(src==="mr"){setProg(t("p_mr"),35);await mrIdentify(left)}
    else if(cfOn()){setProg(t("p_cf"),45);try{await cfIdentify(left)}catch(err){cfErr(err)}}
  }
  const left=ents.filter(e=>!e.src);done=0;
  await pool(left,3,async e=>{try{await nameSearch(e)}catch(_){}setProg(t("p_name"),55+(++done/Math.max(1,left.length))*15)});
  ents.push(...S.added);
  const groups={};
  for(const e of ents){e.dup=false;if(!e.src)continue;(groups[e.src+":"+e.pid]=groups[e.src+":"+e.pid]||[]).push(e)}
  for(const g of Object.values(groups))if(g.length>1){g.sort((a,b)=>new Date((b.cur&&b.cur.date)||0)-new Date((a.cur&&a.cur.date)||0));g.slice(1).forEach(e=>e.dup=true)}
  const lc={},gc={};
  for(const e of ents){const l=e.meta.loader||(e.cur&&e.cur.loaders.find(x=>LOADERS.includes(x)));if(l)lc[l]=(lc[l]||0)+1;if(e.cur)for(const v of new Set(e.cur.gv))gc[v]=(gc[v]||0)+1}
  const top=o=>Object.keys(o).sort((a,b)=>o[b]-o[a]||vIdx(a)-vIdx(b))[0];
  S.pack={loader:top(lc)||"fabric",version:top(gc)||null};
  S.entries=ents;S.identified=true;
  fillVersions();
}
async function mrIdentify(list){
  const res=await mr("/version_files",{method:"POST",body:{hashes:list.map(e=>e.sha1),algorithm:"sha1"}})||{};
  for(const e of list){const v=res[e.sha1];if(v){e.src="mr";e.match="hash";e.pid=v.project_id;e.cur=mrVer(v)}}
  await mrLoadProjects(list.filter(e=>e.src==="mr").map(e=>e.pid));
  for(const e of list)if(e.src==="mr")e.project=S.mrProj[e.pid]||{id:e.pid,title:e.fileName,url:"https://modrinth.com/project/"+e.pid,gv:[],src:"mr"};
}
async function cfIdentify(list){
  const res=await cf("/fingerprints/432",{method:"POST",body:{fingerprints:list.map(e=>e.fp)}});
  const by={};for(const x of (res&&res.data&&res.data.exactMatches)||[])by[x.file.fileFingerprint]=x;
  for(const e of list){const x=by[e.fp];if(x){e.src="cf";e.match="hash";e.pid=x.id;e.cur=cfFile(x.file)}}
  await cfLoadMods(list.filter(e=>e.src==="cf").map(e=>e.pid));
  for(const e of list)if(e.src==="cf")e.project=S.cfProj[e.pid]||{id:e.pid,title:e.fileName,url:"https://www.curseforge.com/minecraft/mc-mods",allowDist:true,latest:[],src:"cf"};
}
function pickHit(hits,e,slugOf,titleOf){const ids=[e.meta.modId,e.meta.name].filter(Boolean).map(norm).filter(Boolean);if(!ids.length)return null;return (hits||[]).find(h=>ids.includes(norm(slugOf(h)))||ids.includes(norm(titleOf(h))))}
async function nameSearch(e){
  const q=e.meta.name||e.meta.modId;if(!q)return;
  const facets=[["project_type:mod"]];if(e.meta.loader)facets.push(["categories:"+e.meta.loader]);
  const r=await mr("/search?limit=5&query="+enc(q)+"&facets="+enc(JSON.stringify(facets)));
  const h=pickHit(r&&r.hits,e,x=>x.slug,x=>x.title);
  if(h){e.src="mr";e.match="name";e.pid=h.project_id;e.project=S.mrProj[h.project_id]||(S.mrProj[h.project_id]=mrProjN(h));return}
  if(cfOn()){try{const r2=await cf("/mods/search?gameId=432&classId=6&pageSize=5&searchFilter="+enc(q));const h2=pickHit(r2&&r2.data,e,x=>x.slug,x=>x.name);if(h2){e.src="cf";e.match="name";e.pid=h2.id;e.project=S.cfProj[h2.id]||(S.cfProj[h2.id]=cfProjN(h2))}}catch(_){}}
}

/* ---------- plan ---------- */
function channels(){return SET.channel==="alpha"?["release","beta","alpha"]:SET.channel==="beta"?["release","beta"]:["release"]}
async function versionsFor(src,pid,ctx){
  const key=src+":"+pid+":"+ctx.loader+":"+ctx.target;
  if(S.vcache[key])return S.vcache[key];
  let list=[];
  if(src==="mr"){
    const r=await mr("/project/"+pid+"/version?include_changelog=false&loaders="+enc(JSON.stringify(ctx.okLoaders))+"&game_versions="+enc(JSON.stringify([ctx.target])))||[];
    list=r.map(mrVer);
  }else{
    for(const l of ctx.okLoaders){
      const r=await cf("/mods/"+pid+"/files?pageSize=50&gameVersion="+enc(ctx.target)+"&modLoaderType="+CF_LOADER[l]);
      list=((r&&r.data)||[]).map(cfFile).filter(v=>v.gv.includes(ctx.target));
      if(list.length)break;
    }
  }
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  return S.vcache[key]=list;
}
function lastSupported(e,ctx){
  const p=e.project||{};
  if(e.src==="mr")return newest(p.gv)||null;
  const ids=ctx.okLoaders.map(l=>CF_LOADER[l]);
  return newest((p.latest||[]).filter(x=>ids.includes(x.modLoader)).map(x=>x.gameVersion))||null;
}
async function planOne(e,ctx){
  if(e.dup)return{st:"dup"};
  if(!e.src)return{st:"unknown"};
  const cur=e.cur;
  const curOk=cur&&cur.gv.includes(ctx.target)&&cur.loaders.some(l=>ctx.okLoaders.includes(l));
  if(ctx.mode==="setver"&&curOk)return{st:"keep",ver:cur};
  let list=[],best=e.batch||null;
  if(!best){
    try{list=await versionsFor(e.src,e.pid,ctx)}catch(err){if(e.src==="cf")cfErr(err);return{st:"missing",note:t("e_net",{m:err.message})}}
    best=list.find(v=>ctx.allowed.includes(v.type));
  }
  if(!best){
    if(curOk)return{st:"keep",ver:cur,note:list.length?t("n_onlyPre",{c:list[0].type,n:list[0].number}):""};
    if(list.length)return{st:"missing",note:t("n_onlyPre",{c:list[0].type,n:list[0].number})};
    const last=lastSupported(e,ctx);
    return{st:"missing",note:last?t("n_last",{v:last}):t("n_noLast")};
  }
  if(cur&&best.id===cur.id)return{st:"current",ver:cur};
  if(e.src==="cf"&&(!best.file.url||(e.project&&e.project.allowDist===false)))return{st:"manual",ver:best,note:t("n_manual")};
  return{st:"update",ver:best};
}
async function plan(){
  const mode=document.querySelector("input[name=mode]:checked").value;
  const loader=$("selLoader").value==="auto"?S.pack.loader:$("selLoader").value;
  const picked=$("txtVer").hidden?$("selVer").value:$("txtVer").value.trim();
  const target=mode==="update"?S.pack.version:picked;
  if(!target)throw new Error(t("e_noTarget"));
  const ctx={mode,loader,target,okLoaders:loader==="quilt"?["quilt","fabric"]:[loader],allowed:channels()};
  S.ctx=ctx;
  S.entries=S.entries.filter(e=>!e.isDep);
  let done=0;const base=S.entries;
  base.forEach(e=>e.batch=undefined);
  const mrHash=base.filter(e=>e.src==="mr"&&e.match==="hash"&&!e.dup);
  if(mrHash.length){
    setProg(t("p_plan"),72);
    try{
      const r=await mr("/version_files/update",{method:"POST",body:{hashes:mrHash.map(e=>e.sha1),algorithm:"sha1",loaders:ctx.okLoaders,game_versions:[ctx.target],version_types:ctx.allowed}})||{};
      for(const e of mrHash){const v=r[e.sha1];e.batch=v&&(v.game_versions||[]).includes(ctx.target)&&ctx.allowed.includes(v.version_type)?mrVer(v):null}
    }catch(err){if(err.message===t("e_v2"))throw err}
  }
  await pool(base,4,async e=>{e.plan=await planOne(e,ctx);setProg(t("p_plan"),70+(++done/base.length)*20)});
  if(SET.autoDeps){setProg(t("p_deps"),92);await resolveDeps(ctx)}
  for(const e of S.entries){
    const st=e.plan.st;
    e.wrongLoader=!!(e.meta.loader&&!ctx.okLoaders.includes(e.meta.loader));
    e.mcOk=st==="unknown"&&!e.wrongLoader?mcSat(e.meta,target):null;
    if(st==="unknown")e.include=!e.wrongLoader&&!e.meta.bad&&!e.meta.none&&(mode==="update"?e.mcOk!==false:e.mcOk===true);
    else e.include=["update","keep","current"].includes(st);
    if(e.uid in S.userInc&&canInclude(e))e.include=S.userInc[e.uid];
  }
  await computeRecs(ctx);
  S.popOffset=0;await loadPopular();
  S.javaInfo=await javaFor(target);
}
async function loadPopular(){
  const ctx=S.ctx;S.pop=[];if(!ctx)return;
  const cc={};
  for(const e of S.entries){if(!e.include||!e.project)continue;for(const c of e.project.cats||[])cc[c]=(cc[c]||0)+1}
  const top=Object.keys(cc).sort((a,b)=>cc[b]-cc[a]).slice(0,4);
  const facets=[["project_type:mod"],ctx.okLoaders.map(l=>"categories:"+l),["versions:"+ctx.target]];
  if(top.length)facets.push(top.map(c=>"categories:"+c));
  const slugs=new Set(S.entries.map(e=>norm(e.project&&e.project.slug)).filter(Boolean));
  try{
    for(let tries=0;tries<3&&S.pop.length<6;tries++){
      const r=await mr("/search?limit=20&index=downloads&offset="+S.popOffset+"&facets="+enc(JSON.stringify(facets)));
      S.popTotal=(r&&r.total_hits)||0;
      for(const h of (r&&r.hits)||[]){
        if(S.pop.length>=6)break;
        if(isAdded(h.project_id)||S.dismiss.has(h.project_id)||slugs.has(norm(h.slug))||S.recs.some(x=>x.p.id===h.project_id))continue;
        S.pop.push(S.mrProj[h.project_id]||(S.mrProj[h.project_id]=mrProjN(h)));
      }
      if(S.pop.length>=6||!S.popTotal)break;
      S.popOffset+=20;if(S.popOffset>=S.popTotal)S.popOffset=0;
    }
  }catch(_){}
}
async function refreshRecs(){
  if(!S.ctx||S.recBusy)return;
  S.recBusy=true;$("btnRecRefresh").disabled=true;$("btnRecRefresh").textContent=t("recLoading");
  S.popOffset+=20;if(S.popTotal&&S.popOffset>=S.popTotal)S.popOffset=0;
  try{await computeRecs(S.ctx);await loadPopular()}catch(_){}
  S.recBusy=false;renderRecs();
}
const canInclude=e=>["update","keep","current","unknown"].includes(e.plan.st);
const numPart=v=>(String(v).match(/^\d+(?:\.\d+)*/)||["0"])[0];
function verOp(op,want,v){
  if(/[x*]/i.test(want)){const pre=want.split(/\.?[x*]/i)[0];return !pre||v===pre||v.startsWith(pre+".")}
  const c=cmpVer(numPart(v),numPart(want)),a=numPart(want).split("."),b=numPart(v).split(".");
  switch(op){case">=":return c>=0;case"<=":return c<=0;case">":return c>0;case"<":return c<0;
    case"~":return c>=0&&a[0]===b[0]&&(a.length<2||a[1]===b[1]);
    case"^":return c>=0&&a[0]===b[0];
    default:return c===0}
}
function mcSat(meta,v){
  const spec=meta.mcReq;if(spec==null||spec==="")return null;
  try{
    if(meta.mcMaven){
      const s=String(spec).trim();if(s==="*"||s==="")return true;
      return s.split(/(?<=[\])]),/).some(r=>{r=r.trim();
        const m=/^([\[(])\s*([^,]*?)\s*(?:,\s*([^\])]*?)\s*)?([\])])$/.exec(r);
        if(!m)return cmpVer(numPart(v),numPart(r))>=0;
        if(m[3]===undefined)return cmpVer(numPart(v),numPart(m[2]))===0;
        const lo=m[2],hi=m[3];
        if(lo&&!(m[1]==="["?cmpVer(numPart(v),numPart(lo))>=0:cmpVer(numPart(v),numPart(lo))>0))return false;
        if(hi&&!(m[4]==="]"?cmpVer(numPart(v),numPart(hi))<=0:cmpVer(numPart(v),numPart(hi))<0))return false;
        return true});
    }
    const alts=(Array.isArray(spec)?spec:[spec]).flatMap(s=>String(s).split("||"));
    return alts.some(a=>{const parts=a.trim().replace(/(>=|<=|>|<|=|~|\^)\s+/g,"$1").split(/\s+/).filter(Boolean);
      if(!parts.length||parts.includes("*"))return true;
      return parts.every(p=>{const m=/^(>=|<=|>|<|=|~|\^)?(.+)$/.exec(p);return verOp(m[1]||"=",m[2],v)})});
  }catch(_){return null}
}
async function computeRecs(ctx){
  S.recs=[];
  const have=new Set(S.entries.filter(e=>e.src).map(e=>e.src+":"+e.pid)),slugs=new Set(S.entries.map(e=>norm(e.project&&e.project.slug)).filter(Boolean)),want=new Map();
  for(const e of S.entries){if(!e.include||e.src!=="mr")continue;const v=e.plan.ver||e.cur;for(const id of (v&&v.opt)||[])if(!have.has("mr:"+id)&&!want.has(id))want.set(id,title(e))}
  if(!want.size)return;
  try{await mrLoadProjects([...want.keys()])}catch(_){return}
  for(const [id,forName] of want){
    const p=S.mrProj[id];
    if(!p||slugs.has(norm(p.slug))||S.dismiss.has(id))continue;
    if(p.loaders&&p.loaders.length&&!p.loaders.some(l=>ctx.okLoaders.includes(l)))continue;
    if(p.gv&&p.gv.length&&!p.gv.includes(ctx.target))continue;
    S.recs.push({p,forName});if(S.recs.length>=12)break;
  }
}
const JAVA_FALLBACK=v=>{const p=String(v).split(/[.\-]/).map(Number);if(p[0]>=26)return 25;if(p[0]!==1)return null;const mi=p[1],pa=p[2]||0;if(mi<=16)return 8;if(mi===17)return 16;if(mi<20||(mi===20&&pa<=4))return 17;return 21};
async function javaFor(v){
  if(S.java[v])return S.java[v];
  try{
    if(!S.manifest)S.manifest=await (await fetch("https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")).json();
    const it=S.manifest.versions.find(x=>x.id===v);
    if(it){const j=await (await fetch(it.url)).json();if(j.javaVersion)return S.java[v]={j:j.javaVersion.majorVersion,est:false}}
  }catch(_){}
  const f=JAVA_FALLBACK(v);return S.java[v]=f?{j:f,est:true}:null;
}
function orphans(){
  const inc=S.entries.filter(e=>e.include),ids=new Set(),keys=new Set(),res=new Set();
  for(const e of inc){const v=e.plan.ver||e.cur;for(const d of (v&&v.deps)||[]){if(d.project_id)ids.add("mr:"+d.project_id);if(d.cfModId)ids.add("cf:"+d.cfModId)}for(const k of e.meta.deps||[])keys.add(String(k).toLowerCase())}
  const needed=e=>{const ids=[e.meta.modId].concat(e.meta.provides||[]).filter(Boolean).map(x=>String(x).toLowerCase());return ids.some(i=>keys.has(i))};
  for(const e of S.entries){
    if(!(e.project&&e.project.lib)||e.isDep||e.dup||!canInclude(e))continue;
    if(ids.has(e.src+":"+e.pid))continue;
    const id=(e.meta.modId||"").toLowerCase();
    if(!id||needed(e))continue;
    if(id==="fabric-api"&&[...keys].some(k=>k==="fabric"||(/^fabric-/.test(k)&&!/^fabric-(language-kotlin|loader)/.test(k))))continue;
    res.add(e.uid);
  }
  return res;
}
function minVer(spec){if(!spec||spec==="*")return null;const r=/(\d+(?:\.\d+)+)/.exec(String(spec));return r?r[1]:null}
function cmpVer(a,b){const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}
async function loaderReq(out){
  const L=S.ctx.loader;let best=null;
  for(const o of out){
    let m=o.e.meta||{};
    if(!o.kept){try{m=await readMeta(o.buf)}catch(_){m={}}}
    if(m.loader!==L)continue;
    const v=minVer(m.loaderReq);if(v&&(!best||cmpVer(v,best)>0))best=v;
  }
  return best;
}
const LOADER_PAGE={fabric:["Fabric Loader","https://fabricmc.net/use/installer/"],quilt:["Quilt Loader","https://quiltmc.org/en/install/"],neoforge:["NeoForge","https://neoforged.net/"],forge:["Forge","https://files.minecraftforge.net/"]};
async function resolveDeps(ctx){
  const have=new Set(),slugs=new Set();
  for(const e of S.entries)if(e.src){have.add(e.src+":"+e.pid);if(e.project&&e.project.slug)slugs.add(norm(e.project.slug))}
  const queue=[];
  const push=e=>{const v=e.plan&&e.plan.ver;if(v&&["update","keep","current","manual"].includes(e.plan.st))for(const d of v.deps||[])queue.push({d,from:e,src:e.src})};
  S.entries.forEach(push);
  let guard=0;
  while(queue.length&&guard++<300){
    const {d,from,src}=queue.shift();
    let pid=src==="mr"?d.project_id:d.cfModId;
    try{
      if(src==="mr"&&!pid&&d.version_id){const v=await mr("/version/"+d.version_id);pid=v&&v.project_id}
      if(!pid||have.has(src+":"+pid))continue;
      have.add(src+":"+pid);
      if(src==="mr")await mrLoadProjects([pid]);else await cfLoadMods([pid]);
      const project=src==="mr"?S.mrProj[pid]:S.cfProj[pid];
      if(!project||slugs.has(norm(project.slug)))continue;
      if(project.loaders&&project.loaders.length&&!project.loaders.some(l=>ctx.okLoaders.includes(l)))continue;
      if(project.latest&&project.latest.length){const ids=ctx.okLoaders.map(l=>CF_LOADER[l]);if(!project.latest.some(x=>ids.includes(x.modLoader)))continue}
      slugs.add(norm(project.slug));
      const de={uid:"d_"+src+"_"+pid,isDep:true,depOf:(from.project&&from.project.title)||from.fileName,src,pid,project,meta:{}};
      de.plan=await planOne(de,ctx);
      S.entries.push(de);push(de);
    }catch(err){if(src==="cf")cfErr(err)}
  }
}

/* ---------- download & output ---------- */
function cfDlUrl(url){const p=SET.cfProxy.trim().replace(/\/+$/,"");if(p)return p+"/dl?u="+enc(url);if(SET.cfKey)return url+(url.includes("?")?"&":"?")+"api-key="+enc(SET.cfKey.trim());return url}
function manualLink(e){const v=e.plan.ver;if(e.src==="cf")return v&&v.id&&e.project.url?e.project.url.replace(/\/$/,"")+"/files/"+v.id:e.project.url;return (v&&v.file&&v.file.url)||e.project.url}
async function fetchFile(e){
  const f=e.plan.ver.file;
  const r=await fetch(e.src==="cf"?cfDlUrl(f.url):f.url);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const buf=await r.arrayBuffer();
  if(f.sha1&&(await sha1hex(buf))!==f.sha1.toLowerCase())throw new Error(t("hashBad"));
  return{name:f.name,buf};
}
async function collect(){
  const sel=S.entries.filter(e=>e.include);
  if(!sel.length)throw new Error(t("e_noSel"));
  const out=[],manual=S.entries.filter(e=>e.plan.st==="manual").map(e=>({e,reason:t("n_manual")}));
  let done=0;
  await pool(sel,3,async e=>{
    try{
      if(["keep","current","unknown"].includes(e.plan.st)&&e.file)out.push({e,kept:true,name:e.fileName.replace(/\s*\(\d+\)(?=\.jar$)/i,""),buf:await e.file.arrayBuffer()});
      else out.push(Object.assign({e},await fetchFile(e)));
    }catch(err){manual.push({e,reason:t("dlFailed",{r:err.message==="Failed to fetch"?"CORS":err.message})})}
    ++done;setProg(t("p_dl")+" "+done+"/"+sel.length,done/sel.length*90);
  });
  S.lastManual=manual;
  return{out,manual};
}
function cfSearch(e){const q=e.meta.name||e.meta.modId||e.fileName.replace(/\.jar$/i,"").replace(/[-_+]?(mc)?\d[\w.+-]*$/i,"");return "https://www.curseforge.com/minecraft/search?class=mc-mods&search="+enc(q)}
function title(e){return (e.project&&e.project.title)||e.meta.name||e.fileName}

  if(S.configs.length)L.push(t("r_cfg")+": "+S.configs.length);
  L.push("");
  L.push(t("r_files")+" ("+out.length+"):");
  for(const o of out){const e=o.e,ol=e.cur?e.cur.number:"",nw=e.plan.ver?e.plan.ver.number:ol;L.push("  ["+t("r_st_"+stKey(e))+"] "+title(e)+(ol&&ol!==nw?"  "+ol+" -> "+nw:nw?"  "+nw:"")+"  ("+(e.src==="cf"?"CurseForge":e.src==="mr"?"Modrinth":"-")+")  "+o.name)}
  if(manual.length){L.push("",t("r_manual")+":");for(const m of manual)L.push("  - "+title(m.e)+": "+manualLink(m.e)+"  ("+m.reason+")")}

  syncMode();setStale();$("btnAnalyze").focus();
}

/* ---------- changelog + translate ---------- */
let CL=null;
function htmlToText(h){const s=String(h).replace(/<(br|\/p|\/li|\/h\d|\/div|\/ul)[^>]*>/gi,"\n").replace(/<li[^>]*>/gi,"- ").replace(/<h\d[^>]*>/gi,"## ");return (new DOMParser().parseFromString(s,"text/html").body.textContent||"").replace(/\n{3,}/g,"\n\n").trim()}
function md(s){let h=esc(s);h=h.replace(/^#{1,6}\s*(.*)$/gm,"<h5>$1</h5>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/^\s*[-*+]\s+/gm,"• ");return h.replace(/\n/g,"<br>")}
function renderCl(){
  const items=CL.showTr&&CL.tr?CL.tr:CL.items;
  $("clInfo").textContent=items.length>1?t("clCount",{n:items.length}):"";
  $("clBody").innerHTML=items.map(i=>"<h4>"+esc(i.h)+"</h4><div>"+(i.text?md(i.text):'<span class="info">'+esc(t("clNone"))+"</span>")+"</div>").join("");
}
async function openChangelog(uid){
  const e=S.entries.find(x=>x.uid===uid);if(!e||!e.plan.ver)return;
  CL={items:[],tr:null,showTr:false};
  $("clTitle").textContent=title(e);$("clBody").innerHTML='<p class="info">'+esc(t("clLoading"))+"</p>";$("clInfo").textContent="";
  $("clTr").textContent=t("translate");$("clTr").disabled=true;
  $("clDlg").showModal();
  try{
    const target=e.plan.ver,cur=e.cur;
    let list=[];try{list=await versionsFor(e.src,e.pid,S.ctx)}catch(_){}
    let sel=list.filter(v=>new Date(v.date)<=new Date(target.date)&&(!cur||new Date(v.date)>new Date(cur.date)));
    if(!sel.some(v=>v.id===target.id))sel.unshift(target);
    sel=sel.slice(0,10);
    if(e.src==="mr"){
      const r=await mr("/versions?ids="+enc(JSON.stringify(sel.map(v=>v.id))))||[];
      r.sort((a,b)=>new Date(b.date_published)-new Date(a.date_published));
      CL.items=r.map(v=>({h:v.version_number,text:(v.changelog||"").trim()}));
    }else{
      for(const v of sel.slice(0,5)){const r=await cf("/mods/"+e.pid+"/files/"+v.id+"/changelog");CL.items.push({h:v.number,text:htmlToText((r&&r.data)||"")})}
    }
    renderCl();
    $("clTr").disabled=!CL.items.some(i=>i.text);
  }catch(err){$("clBody").innerHTML='<p class="msg bad">'+esc(t("e_net",{m:err.message}))+"</p>"}
}
async function gtx(text,tl){
  const parts=[];let cur="";
  for(const line of text.split("\n")){if(cur&&cur.length+line.length>1400){parts.push(cur);cur=""}cur+=line+"\n"}
  if(cur)parts.push(cur);
  let out="";
  for(const p of parts){const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+tl+"&dt=t&q="+enc(p));if(!r.ok)throw new Error(r.status);const j=await r.json();out+=(j[0]||[]).map(x=>x[0]).join("")}
  return out.trim();
}
async function toggleTranslate(){
  if(!CL)return;
  if(CL.tr){CL.showTr=!CL.showTr;$("clTr").textContent=t(CL.showTr?"showOrig":"translate");renderCl();return}
  const tl=SET.lang==="tr"?"tr":"en";
  $("clTr").disabled=true;$("clInfo").textContent=t("trWorking");
  try{
    const tr=[];for(const i of CL.items)tr.push({h:i.h,text:i.text?await gtx(i.text,tl):""});
    CL.tr=tr;CL.showTr=true;$("clTr").textContent=t("showOrig");renderCl();
  }catch(_){
    const all=CL.items.map(i=>i.h+"\n"+i.text).join("\n\n").slice(0,4500);
    $("clInfo").innerHTML=esc(t("trFail"))+' <a href="https://translate.google.com/?sl=auto&amp;tl='+tl+"&amp;op=translate&amp;text="+enc(all)+'" target="_blank" rel="noopener">'+esc(t("openGT"))+"</a>";
  }
  $("clTr").disabled=false;
}

const WORKER=`// ModShift - CurseForge proxy (Cloudflare Worker)
// Secret: CF_KEY = your CurseForge API key
// Open the Worker address in a browser to check that it works.
export default {
  async fetch(req, env) {
    const cors = {
      "Access-Control-Allow-Origin": "*",
      "Access-Control-Allow-Headers": "content-type, accept",
      "Access-Control-Allow-Methods": "GET, POST, OPTIONS"
    };
    const json = (o, s) => new Response(JSON.stringify(o, null, 2), { status: s || 200, headers: { ...cors, "content-type": "application/json" } });
    if (req.method === "OPTIONS") return new Response(null, { headers: cors });
    const key = String(env.CF_KEY || "").trim();
    const u = new URL(req.url);
    const headers = { "x-api-key": key, "accept": "application/json", "user-agent": "ModShift/1.0 (+https://tanto81pro.github.io/Mod-Shift/)" };
    if (u.pathname === "/" || u.pathname === "/status") {
      let curseforge = "not tested";
      if (key) {
        const t = await fetch("https://api.curseforge.com/v1/games/432", { headers });
        curseforge = t.ok ? "OK, the key works" : "CurseForge answered " + t.status + (t.status === 403 ? " (key rejected)" : "");
      }
      return json({ worker: "running", keySet: !!key, keyLength: key.length, keyLooksRight: key.length === 60 && key.startsWith("$2a$10$"), curseforge });
    }
    let target;
    if (u.pathname === "/dl") {
      target = u.searchParams.get("u") || "";
      if (!/^https:\\/\\/(edge|mediafilez)\\.forgecdn\\.net\\//.test(target)) return json({ error: "bad url" }, 400);
    } else if (u.pathname.startsWith("/v1/")) {
      if (!key) return json({ error: "CF_KEY secret is missing" }, 500);
      target = "https://api.curseforge.com" + u.pathname + u.search;
    } else {
      return json({ error: "not found" }, 404);
    }
    if (req.method === "POST") headers["content-type"] = "application/json";
    const r = await fetch(target, { method: req.method, headers, body: req.method === "POST" ? await req.text() : undefined });
    if (r.status === 401 || r.status === 403) return json({ error: "CurseForge rejected the API key (" + r.status + ")" }, r.status);
    const h = new Headers(r.headers);
    for (const k in cors) h.set(k, cors[k]);
    return new Response(r.body, { status: r.status, headers: h });
  }
};`;
